name: napari-clemreg
schema_version: 0.1.0
contributions:
  commands:
  - id: napari-clemreg.make_run_registration
    title: Run registration
    python_name: napari_clemreg.widgets.run_registration:make_run_registration_widget
  - id: napari-clemreg.get_reader
    title: Get Reader
    python_name: napari_clemreg._reader:napari_get_reader
  - id: napari-clemreg.sample_data
    title: Sample Benchmark Data
    python_name: napari_clemreg.clemreg.sample_data:make_sample_data
  - id: napari-clemreg.ome_zarr_sample_data
    title: Sample Benchmark Data (OME-Zarr)
    python_name: napari_clemreg.clemreg.sample_data:make_ome_zarr_sample_data
  - id: napari-clemreg.em_mask_sample_data
    title: EM Mask Sample Data
    python_name: napari_clemreg.clemreg.sample_data:make_em_mask_sample_data
  readers:
  - command: napari-clemreg.get_reader
    filename_patterns:
    - '*.tif'
    - '*.tiff'
    accepts_directories: true
  sample_data:
  - command: napari-clemreg.sample_data
    display_name: Sample Benchmark Data
    key: benchmark_dataset.1
  - command: napari-clemreg.ome_zarr_sample_data
    display_name: Sample Benchmark Data (OME-Zarr, streamed from the BioImage Archive)
    key: benchmark_dataset_ome_zarr.1
  - command: napari-clemreg.em_mask_sample_data
    display_name: EM Mask (precomputed, no GPU needed)
    key: em_mask.1
  widgets:
  - command: napari-clemreg.make_run_registration
    display_name: Run registration
