[metadata]
name = napari-clemreg
version = 0.2.1
author = Daniel Krentzel
author_email = dkrentzel@pm.me
license = MIT
url = https://github.com/krentzd/napari-clemreg
description = A plugin for registering multimodal image volumes based on common segmented structures of interest with point-clouds.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
	Development Status :: 2 - Pre-Alpha
	Intended Audience :: Developers
	Framework :: napari
	Topic :: Software Development :: Testing
	Programming Language :: Python
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3.11
	Programming Language :: Python :: 3.12
	Operating System :: OS Independent
	License :: OSI Approved :: MIT License
project_urls = 
	Bug Tracker = https://github.com/krentzd/napari-clemreg/issues
	Documentation = https://github.com/krentzd/napari-clemreg#README.md
	Source Code = https://github.com/krentzd/napari-clemreg
	User Support = https://github.com/krentzd/napari-clemreg/issues

[options]
packages = find:
python_requires = >=3.11
setup_requires = setuptools_scm
install_requires =
	typing_extensions
	setuptools
	packaging
	numpy >= 1.26,<3
	magicgui >= 0.8.3
	# Imported directly for the pixel-size fields. >=0.21 for Quantity.to_preferred,
	# which napari's own floor (pint>=0.17) doesn't guarantee.
	pint >= 0.21
	scipy >= 1.11
	napari >= 0.6
	scikit-image >= 0.22
	h5py >= 3.9.0
	matplotlib >= 3.7.3
	imageio >= 2.31.5
	tifffile >= 2023.7.10
	bioio >= 3.5.1
	bioio-tifffile >= 1.3.1
	probreg >= 0.3.6
	open3d >= 0.18
	transforms3d >= 0.4.1
	tqdm >= 4.66.1
	pooch >= 1.8
	# The OME-Zarr sample data, streamed over HTTPS. zarr's HTTP store needs
	# fsspec >= 2023.10; bioio only brings fsspec[http] from 3.7.1.
	zarr >= 3.1
	dask[array] >= 2024.1
	fsspec[http] >= 2023.10
	aiohttp >= 3.9
	connected-components-3d >= 3.12.3
	superqt >= 0.8.2

include_package_data = True

[options.extras_require]
# Optional: the bundled EM Segmentation (MitoNet) widget, via empanada-dl.
# Split out of install_requires because empanada-dl is stuck at 0.1.7 and
# hard-pins numpy==1.22, which has no Python 3.11 wheels -- keeping it in
# install_requires meant `pip install napari-clemreg` couldn't resolve on
# Python 3.11 AT ALL, not just this one feature. As a result,
# `pip install napari-clemreg[empanada]` itself still won't resolve on
# Python 3.11 today; the base package (and the `segment-flow` extra below)
# installs and works fine without it. Tracked at
# https://github.com/martlj/napari-clemreg/issues/5; do not loosen this pin
# until a compatible empanada-dl (or replacement) is available.
empanada =
	empanada-dl == 0.1.7
	torch >= 2.2

# Optional: EM segmentation via Crick's AI-on-Demand (Segment-Flow) instead
# of empanada-dl -- see clemreg/segment_flow_segmentation.py and issue #5.
# Also needs Nextflow and Conda on PATH (not pip-installable), but has no
# Python-version conflict like the empanada extra above. aiod_registry
# (a lightweight, pure-Python package -- confirmed no heavy ML deps) is
# used to generate and patch the model config ourselves (see
# _build_model_config_with_conf_threshold docstring for why).
segment-flow =
	aiod_utils
	aiod_registry
	pyyaml

[options.entry_points]
napari.manifest = 
	napari-clemreg = napari_clemreg:napari.yaml

[options.package_data]
* = *.yaml
napari_clemreg.clemreg.data = *.tif

[tool:pytest]
# testpaths also makes pytest load napari_clemreg/_tests/conftest.py before
# parsing options, so its --run-slow option works when pytest is run with
# no path arguments (as tox does).
testpaths = napari_clemreg/_tests
markers =
	slow: marks tests as slow/network-heavy (run with --run-slow)
